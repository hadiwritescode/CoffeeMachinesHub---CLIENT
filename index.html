
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <title>Coffee Machines Hub | Premium Gear & Beans</title>
    <meta name="description" content="Premium Italian espresso machines and specialty coffee." />
    <meta name="theme-color" content="#3B261B" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              'nomad-black': '#3B261B',
              'nomad-gold': '#B08B5B',
              'nomad-dark-gold': '#8C6B42',
              'nomad-paper': '#F5F0E6',
              'nomad-cream': '#EAE4D6',
              'nomad-gray': '#E0D8CC',
            },
            animation: {
              'fade-in': 'fadeIn 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'slide-up': 'slideUp 2s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'slide-right': 'slideRight 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'toast-in': 'toastIn 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'marquee': 'marquee 20s linear infinite',
              'zoom-in': 'zoomIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-down': 'slideDown 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(40px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              slideRight: { '0%': { transform: 'translateX(30px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
              slideDown: { '0%': { transform: 'translateY(-10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              toastIn: { '0%': { transform: 'translateY(-20px) translateX(-50%)', opacity: '0' }, '100%': { transform: 'translateY(0) translateX(-50%)', opacity: '1' } },
              marquee: { '0%': { transform: 'translateX(0%)' }, '100%': { transform: 'translateX(-50%)' } },
              zoomIn: { '0%': { opacity: '0', transform: 'scale(0.96)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #3B261B; /* Changed to footer color for reveal effect */
        color: #3B261B;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Smooth appearing elements */
      .fade-up-init {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1), transform 1s cubic-bezier(0.19, 1, 0.22, 1);
        will-change: transform, opacity;
      }
      .fade-up-init.visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      img { content-visibility: auto; }
      
      .hover-underline-animation {
        position: relative;
      }
      .hover-underline-animation:after {
        content: '';
        position: absolute;
        width: 100%;
        transform: scaleX(0);
        height: 1px;
        bottom: -4px;
        left: 0;
        background-color: currentColor;
        transform-origin: bottom right;
        transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      }
      .hover-underline-animation:hover:after {
        transform: scaleX(1);
        transform-origin: bottom left;
      }
      
      /* Parallax effect helper */
      .parallax-wrapper {
        perspective: 1px;
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3",
    "firebase/app": "https://esm.sh/firebase@10.8.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.8.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.8.1/firestore",
    "firebase/storage": "https://esm.sh/firebase@10.8.1/storage",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.8.0/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
